# ZView (Zephyr のスレッドとヒープを, ホストから実行中に見るツール) のための設定.
# THERMO_ZVIEW=ON のときに, node と gateway の prj.conf に足す (CMakeLists.txt が読み込む).
# 内容は ZView の zview スニペット (snippets/zview/zview.conf) と同じ. 使い方は docs/zview.md

# 実行中に作ったスレッドと, スタックの大きさと, 最大の使用量 (ウォーターマーク) を測るための詰め物
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# スレッドの名前, CPU の使用率, ヒープの使用量と断片化, メモリスラブの最大の使用量
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y

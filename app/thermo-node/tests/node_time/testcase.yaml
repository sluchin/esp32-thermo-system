# thermo-node の単体テスト: node_time.c (偽の RTC で、時刻の換算 (UNIX 時刻と rtc_time)、ローカルタイムへの変換、時刻が未設定のときと、RTC の失敗を確認する).
# twister が、このファイルを探して、native_sim 上で、実行する (docker compose run --rm test-thermo-node).
tests:
  thermo_node.node_time:
    platform_allow:
      - native_sim/native/64
    tags:
      - thermo_node

# thermo-node の単体テスト: sensor.c (TEST_MODE で、構成を切り替える: simulator = シミュレーション値、adc = ADC エミュレータ、adc_setup_error = チャンネルの設定が失敗).
# twister が、このファイルを探して、native_sim 上で、実行する (docker compose run --rm test-thermo-node).
tests:
  thermo_node.sensor.simulator:
    platform_allow:
      - native_sim/native/64
    extra_args:
      - TEST_MODE=simulator
    tags:
      - thermo_node
  thermo_node.sensor.adc:
    platform_allow:
      - native_sim/native/64
    extra_args:
      - TEST_MODE=adc
    tags:
      - thermo_node
  thermo_node.sensor.adc_setup_error:
    platform_allow:
      - native_sim/native/64
    extra_args:
      - TEST_MODE=adc_setup_error
    tags:
      - thermo_node

# THERMO_ZVIEW=ON のときに, app/zview.conf に続けて node だけに足す設定 (CMakeLists.txt が読み込む).
#
# node の RAM (dram0_0_seg) は, 通常のビルドで 99.96 % 使っている. ZView の設定で約 1 KB 増えて,
# 入りきらなくなる. ESP32 のタイマーのスレッド (esp_timer) のスタックは, 4096 バイトのうち 340 バイトしか
# 使っていない (実機の kernel thread stacks で確認) ので, 2048 バイトに減らして, 空きを作る.
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=2048

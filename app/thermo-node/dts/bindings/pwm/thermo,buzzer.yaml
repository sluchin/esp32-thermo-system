description: |
  Passive buzzer driven by a PWM channel (the buzzer of the Seeed Studio XIAO expansion board).
  The frequency of the PWM is the pitch of the sound (the duty cycle is 50%).

compatible: "thermo,buzzer"

include: base.yaml

properties:
  pwms:
    type: phandle-array
    required: true
    description: The PWM channel that drives the buzzer

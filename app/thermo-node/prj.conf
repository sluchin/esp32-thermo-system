# MCUboot ブートローダは使用しない
# CONFIG_BOOTLOADER_MCUBOOT is not set

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Node"
CONFIG_BT_DEVICE_APPEARANCE=896
# ペリフェラルロール (アドバタイズして接続を受け付ける)
CONFIG_BT_PERIPHERAL=y
# GATT データベースを実行時に変更可能にする
CONFIG_BT_GATT_DYNAMIC_DB=y

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO
CONFIG_GPIO=y

# センサ API (DHT11 などの温湿度センサ. Devicetree の alias thermo-sensor)
CONFIG_SENSOR=y

# ADC (アナログの温度センサ用. Devicetree の zephyr,user の io-channels)
CONFIG_ADC=y

# メインスレッドのスタック (OLED のグラフの描画で, 点の配列と履歴を使うため, 既定の 2048 では足りない)
CONFIG_MAIN_STACK_SIZE=4096

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# ファイルシステムのシェル (fs ls, fs cat など). SD カードのログを, picocom で確認するため.
# 注意: rm と write も使えるので, ログの書き込み中は, 実行しないこと (SETUP.md)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

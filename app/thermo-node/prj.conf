# MCUboot ブートローダは使用しない
# CONFIG_BOOTLOADER_MCUBOOT is not set

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Node"
CONFIG_BT_DEVICE_APPEARANCE=896
# ペリフェラルロール (アドバタイズして接続を受け付ける)
CONFIG_BT_PERIPHERAL=y
# 同時に接続できる数. 2 にすると, BLE が使うヒープが増え, WiFi と TLS のぶんが足りなくなり, 直接送信が届かない (RAM が 99.9% 使われている. ゲートウェイと thermo-term は同時に接続できない)
CONFIG_BT_MAX_CONN=1
# GATT データベースを実行時に変更可能にする
CONFIG_BT_GATT_DYNAMIC_DB=y

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO
CONFIG_GPIO=y

# センサ API (AHT20 や DHT11 などの温湿度センサと, BMP280 などの気圧センサ. Devicetree の alias
# thermo-sensor と thermo-pressure). ドライバは Devicetree のノードで, 自動で有効になる.
# DHT11 の設定 (CONFIG_DHT_LOCK_IRQS) は sensors/dht11.conf
CONFIG_SENSOR=y

# ADC (アナログの温度センサ用. Devicetree の zephyr,user の io-channels)
CONFIG_ADC=y

# メインスレッドのスタック (OLED のグラフの描画で, 点の配列と履歴を使うため, 既定の 2048 では足りない.
# WiFi の接続と SNTP (CONFIG_THERMO_WIFI_TIME) も, メインスレッドで呼ぶ)
CONFIG_MAIN_STACK_SIZE=6144

# --- WiFi と SNTP による時刻の取得 (CONFIG_THERMO_WIFI_TIME. BLE で時刻が届かないときだけ使う) ---
# ネットワーク (IPv4 と DHCP のみ)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
# SNTP (時刻の取得)
CONFIG_SNTP=y
# WiFi (ステーションモード)
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
# AWS IoT Core への直接の送信 (CONFIG_THERMO_DIRECT_MQTT. MQTT over TLS. thermo-gateway と同じ設定)
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=6144
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_CRYPT=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_BASE64=y
# 証明書をシェル (cred add) で登録する
CONFIG_TLS_CREDENTIALS_SHELL=y
CONFIG_TLS_CREDENTIALS_SHELL_CRED_BUF_SIZE=2048
CONFIG_HEAP_MEM_POOL_ADD_SIZE_TLS_CRED_SHELL=5000
# RAM を減らす (BLE と WiFi と TLS と SD カードを同時に使うと, RAM が足りなくなるため). ネットワークは MQTT の
# 1 本の接続と DNS だけなので, バッファの数を既定 (RX と TX の net_buf は 36, net_pkt は 14) から減らす.
# SD カードの FatFS は同時に開くファイルを 1 つ (backlog.c) か, シェルの fs コマンドの分だけにする
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=2
# SSID とパスワードをフラッシュ (storage_partition) に保存する
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# ファイルシステムのシェル (fs ls, fs cat など). SD カードのログを picocom で確認するため.
# 注意: rm と write も使えるので, ログの書き込み中は実行しないこと (SETUP.md)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

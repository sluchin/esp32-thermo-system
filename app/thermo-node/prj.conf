# MCUboot ブートローダは使用しない
# CONFIG_BOOTLOADER_MCUBOOT is not set

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Node"
CONFIG_BT_DEVICE_APPEARANCE=896
# ペリフェラルロール (アドバタイズして接続を受け付ける)
CONFIG_BT_PERIPHERAL=y
# GATT データベースを実行時に変更可能にする
CONFIG_BT_GATT_DYNAMIC_DB=y

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO
CONFIG_GPIO=y

# センサ API (DHT11 などの温湿度センサ. Devicetree の alias thermo-sensor)
CONFIG_SENSOR=y

# DHT11 の読み取りの間 (約 22 ミリ秒), 割り込みを止める. BLE などの割り込みが, 読み取り (マイクロ秒単位の
# タイミング) を乱して, Could not fetch the sensor (-5) になるのを防ぐ (実機で, エラーがなくなることを確認した).
# 止めている間は, BLE の処理も止まる (5 秒に 1 回)
CONFIG_DHT_LOCK_IRQS=y

# ADC (アナログの温度センサ用. Devicetree の zephyr,user の io-channels)
CONFIG_ADC=y

# メインスレッドのスタック (OLED のグラフの描画で, 点の配列と履歴を使うため, 既定の 2048 では足りない.
# WiFi の接続と SNTP (CONFIG_THERMO_WIFI_TIME) も, メインスレッドで呼ぶ)
CONFIG_MAIN_STACK_SIZE=6144

# --- WiFi と SNTP による時刻の取得 (CONFIG_THERMO_WIFI_TIME。BLE で時刻が届かないときだけ使う) ---
# ネットワーク (IPv4 と DHCP のみ)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
# SNTP (時刻の取得)
CONFIG_SNTP=y
# WiFi (ステーションモード)
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
# SSID とパスワードを、フラッシュ (storage_partition) に保存する
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# ファイルシステムのシェル (fs ls, fs cat など). SD カードのログを, picocom で確認するため.
# 注意: rm と write も使えるので, ログの書き込み中は, 実行しないこと (SETUP.md)
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

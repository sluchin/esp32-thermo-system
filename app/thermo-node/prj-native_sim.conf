# Simulator mode
CONFIG_SIMULATOR=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Thermo-Node-Sim"
CONFIG_BT_DEVICE_APPEARANCE=896
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Shell (for debugging)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Native simulator specific
CONFIG_NATIVE_LIBRARY=y
CONFIG_MAIN_STACK_SIZE=8192

# Random number generation
CONFIG_RANDOM=y
CONFIG_NATIVE_POSIX_RAND=y

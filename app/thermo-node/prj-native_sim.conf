# シミュレータモード
# アプリ独自の Kconfig: シミュレータ用ビルドを有効にする
CONFIG_SIMULATOR=y

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Node-Sim"
CONFIG_BT_DEVICE_APPEARANCE=896
# ペリフェラルロール (アドバタイズして接続を受け付ける)
CONFIG_BT_PERIPHERAL=y
# GATT データベースを実行時に変更可能にする
CONFIG_BT_GATT_DYNAMIC_DB=y

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# メインスレッドのスタックサイズ [byte]
CONFIG_MAIN_STACK_SIZE=8192

# 乱数生成
# テスト用の乱数生成器を使用 (native_sim 向け)
CONFIG_TEST_RANDOM_GENERATOR=y

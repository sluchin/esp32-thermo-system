# MCUboot ブートローダは使用しない
# CONFIG_BOOTLOADER_MCUBOOT is not set

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Gateway"
CONFIG_BT_DEVICE_APPEARANCE=833
# オブザーバロール (アドバタイズをスキャンする)
CONFIG_BT_OBSERVER=y

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# ネットワーク (ゲートウェイで WiFi を使用する場合)
# CONFIG_NET_CONFIG_SETTINGS is not set

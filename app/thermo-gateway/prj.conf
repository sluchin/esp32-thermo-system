# MCUboot ブートローダは使用しない
# CONFIG_BOOTLOADER_MCUBOOT is not set

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Gateway"
CONFIG_BT_DEVICE_APPEARANCE=833
# セントラルロール (ノードをスキャンして、接続する)
CONFIG_BT_CENTRAL=y
# オブザーバロール (アドバタイズをスキャンする)
CONFIG_BT_OBSERVER=y
# GATT クライアント (ノードのサービスを探索して、温度の通知を購読する)
CONFIG_BT_GATT_CLIENT=y
# 同時に接続できるノードの数 (ESP32_BT_CTLR_LE_MAX_CONN の既定値 3 まで。台数の考え方は TODO.md)
CONFIG_BT_MAX_CONN=3

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# --- AWS IoT Core への送信 (CONFIG_THERMO_CLOUD。WiFi + MQTT over TLS) ---
# ネットワーク (IPv4 と DHCP のみ)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
# SNTP (時刻の同期)
CONFIG_SNTP=y
# WiFi (ステーションモード)
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
# MQTT と TLS (クライアント証明書による相互認証)
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=40000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=6144
# AWS IoT Core が使う暗号方式 (ECDHE-RSA + AES-GCM. 曲線は P-256)
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
# RSA 署名 (サーバ証明書の確認, クライアント認証) と SHA-256
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_CRYPT=y
CONFIG_PSA_WANT_ALG_SHA_256=y
# TLS 1.2 の鍵の導出 (PRF)
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
# PEM 形式の証明書と秘密鍵 (cred add で登録するもの) を読む
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
# TCP の接続と TLS のハンドシェイクの時間制限 [ms] (既定の 3000 では, RSA の計算が間に合わない)
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000
# サーバ証明書の有効期限を、システム時計 (SNTP で同期。ntp.c) で確認する
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
# 証明書の登録のための、シェルのコマンド (cred add など)
CONFIG_BASE64=y
CONFIG_TLS_CREDENTIALS_SHELL=y
# cred のバッファ [byte] (PEM 1 つぶん. 既定の 1024 では、秘密鍵 (約 1.7 KB) が入らない)
CONFIG_TLS_CREDENTIALS_SHELL_CRED_BUF_SIZE=2048
# cred add のための、ヒープ (証明書 3 つぶん: 約 4.5 KB)
CONFIG_HEAP_MEM_POOL_ADD_SIZE_TLS_CRED_SHELL=5000
# 設定と証明書を、フラッシュ (storage_partition) に保存する
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
# SwitchBot の温湿度計の値を、AWS IoT Core に送る間隔 [ms] (1 台あたり。10 秒に 1 回)
CONFIG_THERMO_SWITCHBOT_INTERVAL_MS=10000
# メインスレッドのスタックサイズ [byte]
CONFIG_MAIN_STACK_SIZE=4096

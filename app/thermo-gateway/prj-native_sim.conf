# シミュレータモード
# アプリ独自の Kconfig: シミュレータ用ビルドを有効にする
CONFIG_SIMULATOR=y
# ネットワークのないビルドなので、AWS IoT Core への送信は、無効にする
CONFIG_THERMO_CLOUD=n

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Gateway-Sim"
CONFIG_BT_DEVICE_APPEARANCE=833
# セントラルロール (ノードをスキャンして、接続する)
CONFIG_BT_CENTRAL=y
# オブザーバロール (アドバタイズをスキャンする)
CONFIG_BT_OBSERVER=y
# GATT クライアント (ノードのサービスを探索して、温度の通知を購読する)
CONFIG_BT_GATT_CLIENT=y
# 同時に接続できるノードの数 (ESP32_BT_CTLR_LE_MAX_CONN の既定値 3 まで。台数の考え方は TODO.md)
CONFIG_BT_MAX_CONN=3

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# メインスレッドのスタックサイズ [byte]
CONFIG_MAIN_STACK_SIZE=8192

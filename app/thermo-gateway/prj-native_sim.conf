# シミュレータモード
# アプリ独自の Kconfig: シミュレータ用ビルドを有効にする
CONFIG_SIMULATOR=y

# Bluetooth
CONFIG_BT=y
# デバイス名
CONFIG_BT_DEVICE_NAME="Thermo-Gateway-Sim"
CONFIG_BT_DEVICE_APPEARANCE=833
# オブザーバロール (アドバタイズをスキャンする)
CONFIG_BT_OBSERVER=y

# ログ
CONFIG_LOG=y
# ログを即時出力する (デバッグ向け)
CONFIG_LOG_MODE_IMMEDIATE=y

# コンソール
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# シェル (デバッグ用)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# メインスレッドのスタックサイズ [byte]
CONFIG_MAIN_STACK_SIZE=8192

# Dependabot: 依存の更新を, 週に 1 回 PR にする (マイナー版とパッチ版は, 種類ごとに 1 つの PR にまとめる).
# PR では, いつもの CI が走る. マージは手で行う.
# サブモジュールは入れない (thermo-assets は非公開で, Dependabot は取れない).
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
    ignore:
      # Ubuntu 24.04 より新しい版では, カバレッジの gcovr が失敗する (Zephyr の SDK が対応するまで, 24.04 のまま).
      - dependency-name: "ubuntu"
        versions: [">= 24.10"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

# Dependabot: 依存の更新を, 週に 1 回 PR にする (マイナー版とパッチ版は, 種類ごとに 1 つの PR にまとめる).
# PR では, いつもの CI が走る. マージは手で行う.
# サブモジュールは入れない (thermo-assets は非公開で, Dependabot は取れない).
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
    ignore:
      # Ubuntu は LTS (26.04) のまま. 次の LTS までの版 (26.10 など) には上げない.
      - dependency-name: "ubuntu"
        versions: [">= 26.10"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

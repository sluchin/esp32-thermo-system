name: Build Zephyr Applications

on:
  push:
    branches: [ main, ccr-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            wget \
            curl \
            git
          pip install west

      - name: Download Zephyr SDK
        run: |
          mkdir -p ~/zephyr-sdk
          cd ~/zephyr-sdk
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64.tar.xz
          tar xf zephyr-sdk-0.16.5_linux-x86_64.tar.xz
          zephyr-sdk-0.16.5/setup.sh -t all -h
        continue-on-error: true

      - name: Initialize West workspace
        run: |
          cd $GITHUB_WORKSPACE
          west init -l .
          west config manifest.file WEST.md
          west update 2>/dev/null || true

      - name: Build thermo-node
        run: |
          cd $GITHUB_WORKSPACE
          west build -b xiao_esp32c3 app/thermo-node -d build/thermo-node 2>&1 | head -100

      - name: Build thermo-gateway
        run: |
          cd $GITHUB_WORKSPACE
          west build -b xiao_esp32c3 app/thermo-gateway -d build/thermo-gateway 2>&1 | head -100

      - name: Check build artifacts
        run: |
          ls -la build/thermo-node/ || echo "thermo-node build not found"
          ls -la build/thermo-gateway/ || echo "thermo-gateway build not found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            build/thermo-node/zephyr/zephyr.elf
            build/thermo-node/zephyr/zephyr.hex
            build/thermo-gateway/zephyr/zephyr.elf
            build/thermo-gateway/zephyr/zephyr.hex
          if-no-files-found: ignore

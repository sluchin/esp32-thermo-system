name: CI

# 開発環境 (Dockerfile) と同じイメージで, docker compose のサービスを実行する.
#   build  : 実機 (xiao_esp32c3) 用と, native_sim 用のビルド. 警告が出たら失敗する
#   test   : 単体テスト (Ztest + FFF) を native_sim で実行する (twister)
#   analyze: 静的解析 (gcc -fanalyzer). 指摘があれば失敗する
#   lint   : 整形の確認 (clang-format), Zephyr の checkpatch.pl, 行末の空白の確認. 指摘があれば失敗する
# イメージは, レイヤーを GitHub Actions のキャッシュに保存する (.github/actions/docker-image).

on:
  push:
    branches: [ main, ccr-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - build-thermo-node
          - build-thermo-gateway
          - build-thermo-node-sim
          - build-thermo-gateway-sim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Build
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }} 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::ビルドに警告があります (警告ゼロを維持する)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}
          path: |
            build/*/zephyr/zephyr.elf
            build/*/zephyr/zephyr.bin
            build/*/zephyr/zephyr.exe
          if-no-files-found: warn

  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - test-thermo-node
          - test-thermo-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Run the unit tests
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }}

  coverage:
    name: Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - coverage-thermo-node
          - coverage-thermo-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Check that the coverage is 100%
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Generate the documentation (Doxygen, no warnings allowed)
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm docs-thermo

      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/
          if-no-files-found: error

      - name: Upload the documentation for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # main への push のときだけ, 生成したドキュメントを GitHub Pages へ公開する.
  # リポジトリの Settings > Pages > Source を "GitHub Actions" にしておくこと.
  deploy-docs:
    name: Deploy the documentation
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  analyze:
    name: Static analysis (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - analyze-thermo-node
          - analyze-thermo-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Run the static analysis
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }}

  lint:
    name: Format and lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - format-thermo
          - lint-thermo
          - whitespace-thermo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Check
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }}

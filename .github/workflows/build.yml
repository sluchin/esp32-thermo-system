name: CI

# 開発環境 (Dockerfile) と同じイメージで, docker compose のサービスを実行する.
#   build  : 実機 (xiao_esp32c3) 用と, native_sim 用のビルド. 警告が出たら失敗する. 成果物とログを artifact に保存する
#   test   : 単体テスト (Ztest + FFF) を native_sim で実行する (twister). ログを artifact に保存する
#   coverage: 行と分岐のカバレッジが 100% であること. ログを artifact に保存する
#   docs   : Doxygen のドキュメント. 警告があれば失敗する. ドキュメントとログを artifact に保存する
#   analyze: 静的解析 (gcc -fanalyzer). 指摘があれば失敗する. ログを artifact に保存する
#   lint   : 整形の確認 (clang-format), Zephyr の checkpatch.pl, 行末の空白の確認. 指摘があれば失敗する. ログを artifact に保存する
#   cleanup: 3 日より前の実行 (ログと artifact) を, push のたびに削除する. artifact は, 3 日で期限が切れる (retention-days)
# イメージは, レイヤーを GitHub Actions のキャッシュに保存する (.github/actions/docker-image).

on:
  push:
    branches: [ main, ccr-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: build-thermo-node
            artifact: build_thermo_node
          - service: build-thermo-gateway
            artifact: build_thermo_gateway
          - service: build-thermo-node-sim
            artifact: build_thermo_node_sim
          - service: build-thermo-gateway-sim
            artifact: build_thermo_gateway_sim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Build
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }} 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::ビルドに警告があります (警告ゼロを維持する)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/*/zephyr/zephyr.elf
            build/*/zephyr/zephyr.bin
            build/*/zephyr/zephyr.exe
            build.log
          if-no-files-found: warn
          retention-days: 3

  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: test-thermo-node
            artifact: test_thermo_node
          - service: test-thermo-gateway
            artifact: test_thermo_gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Run the unit tests
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }} 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Upload the test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}_log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: warn
          retention-days: 3

  coverage:
    name: Coverage (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: coverage-thermo-node
            artifact: coverage_thermo_node
          - service: coverage-thermo-gateway
            artifact: coverage_thermo_gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Check that the coverage is 100%
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }} 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Upload the coverage log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}_log
          path: ${{ runner.temp }}/coverage.log
          if-no-files-found: warn
          retention-days: 3

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Generate the documentation (Doxygen, no warnings allowed)
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm docs-thermo 2>&1 | tee "$RUNNER_TEMP/docs.log"

      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs
          path: docs/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the documentation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs_log
          path: ${{ runner.temp }}/docs.log
          if-no-files-found: warn
          retention-days: 3

      - name: Upload the documentation for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # main への push のときだけ, 生成したドキュメントを GitHub Pages へ公開する.
  # リポジトリの Settings > Pages > Source を "GitHub Actions" にしておくこと.
  deploy-docs:
    name: Deploy the documentation
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  analyze:
    name: Static analysis (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: analyze-thermo-node
            artifact: analyze_thermo_node
          - service: analyze-thermo-gateway
            artifact: analyze_thermo_gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Run the static analysis
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }} 2>&1 | tee "$RUNNER_TEMP/analyze.log"

      - name: Upload the analysis log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}_log
          path: ${{ runner.temp }}/analyze.log
          if-no-files-found: warn
          retention-days: 3

  lint:
    name: Format and lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: format-thermo
            artifact: format_thermo
          - service: lint-thermo
            artifact: lint_thermo
          - service: whitespace-thermo
            artifact: whitespace_thermo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Check
        run: |
          set -o pipefail
          env UID="$(id -u)" GID="$(id -g)" docker compose run --rm ${{ matrix.service }} 2>&1 | tee "$RUNNER_TEMP/lint.log"

      - name: Upload the lint log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}_log
          path: ${{ runner.temp }}/lint.log
          if-no-files-found: warn
          retention-days: 3

  # 3 日より前の実行 (ログと artifact) を削除する. 実行中のものは, 3 日より前に始まっていても, 削除できないので, 無視する
  cleanup:
    name: Delete the old runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_DAYS: 3

    steps:
      - name: Delete the runs older than KEEP_DAYS
        run: |
          cutoff="$(date -u -d "${KEEP_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting the runs created before ${cutoff}"
          gh api --paginate -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f per_page=100 -f created="<${cutoff}" --jq '.workflow_runs[].id' |
            while read -r id; do
              echo "Delete the run ${id}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || true
            done

# build で使う環境変数. 値はホストの環境変数 (THERMO_DEBUG_LOG など) をそのまま渡す (なければ, scripts/build.sh の既定値)
x-build-env: &build-env
  - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
  - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
  - HOME=/tmp
  - THERMO_DEBUG_LOG
  - THERMO_DISPLAY
  - THERMO_RTC
  - THERMO_DHT_LOCK_IRQS
  - THERMO_BUZZER

services:
  # thermo-node のビルド (scripts/build.sh. THERMO_DHT_LOCK_IRQS=n で DHT11 の読み取りの間, 割り込みを止めない設定にできる. 既定は y)
  build-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-node-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/build.sh node
    environment: *build-env

  # thermo-gateway のビルド
  build-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-gateway-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/build.sh gateway
    environment: *build-env

  # thermo-node のシミュレーション用ビルド
  build-node-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-node-sim-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west build -b native_sim/native/64 app/thermo-node -d build/thermo-node-sim -- -DTHERMO_DEBUG_LOG=${THERMO_DEBUG_LOG:-OFF} -DCONF_FILE=prj-native_sim.conf -DZephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # thermo-gateway のシミュレーション用ビルド
  build-gateway-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-gateway-sim-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west build -b native_sim/native/64 app/thermo-gateway -d build/thermo-gateway-sim -- -DTHERMO_DEBUG_LOG=${THERMO_DEBUG_LOG:-OFF} -DCONF_FILE=prj-native_sim.conf -DZephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # thermo-node の単体テスト (Ztest + FFF) を native_sim で実行する (twister).
  # 結果の出力先はコンテナの /tmp (ソースツリーには書き込まない).
  test-node:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west twister -T app/thermo-node/tests -p native_sim/native/64 -O /tmp/twister-out --inline-logs -x=Zephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # thermo-gateway の単体テスト (Ztest + FFF) を native_sim で実行する (twister).
  # 結果の出力先はコンテナの /tmp (ソースツリーには書き込まない).
  test-gateway:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west twister -T app/thermo-gateway/tests -p native_sim/native/64 -O /tmp/twister-out --inline-logs -x=Zephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # 共有のコード (app/common) の単体テスト (Ztest + FFF) を native_sim で実行する (twister).
  # 結果の出力先はコンテナの /tmp (ソースツリーには書き込まない).
  test-common:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west twister -T app/common/tests -p native_sim/native/64 -O /tmp/twister-out --inline-logs -x=Zephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # thermo-node の単体テストのカバレッジ (行と分岐) を計測する. 100% 未満なら失敗する.
  coverage-node:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/coverage.sh node
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # thermo-gateway の単体テストのカバレッジ (行と分岐) を計測する. 100% 未満なら失敗する.
  coverage-gateway:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/coverage.sh gateway
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # 共有のコード (app/common) の単体テストのカバレッジ (行と分岐) を計測する. 100% 未満なら失敗する.
  coverage-common:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/coverage.sh common
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # ドキュメント (Doxygen. HTML) を docs/ に生成する. 警告が 1 つでもあれば失敗する.
  docs:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/docs.sh
    environment:
      - HOME=/tmp

  # 整形の確認 (clang-format. Zephyr の .clang-format をインデントだけ空白 4 つに変えたもの). 整形が必要なファイルがあれば失敗する.
  format:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/format.sh
    environment:
      - HOME=/tmp

  # 整形して, ファイルを書き換える (format が失敗したときに実行する).
  format-fix:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/format.sh --fix
    environment:
      - HOME=/tmp

  # 行末の空白の確認 (全てのテキストファイル). clang-format が見ない Markdown, YAML, CMake, シェルスクリプトなども確認する.
  whitespace:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/check-whitespace.sh
    environment:
      - HOME=/tmp

  # Zephyr の checkpatch.pl で検査する (インデントの 3 種類だけ, 無視する). 指摘があれば失敗する.
  lint:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/lint.sh
    environment:
      - HOME=/tmp

  # 静的解析 (gcc -fanalyzer) を thermo-node の app のソースに対して実行する.
  # 通常のビルドとは分けてある. 指摘 (警告) があれば失敗する.
  analyze-node:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/analyze.sh node
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # 静的解析 (gcc -fanalyzer) を thermo-gateway の app のソースに対して実行する.
  # 通常のビルドとは分けてある. 指摘 (警告) があれば失敗する.
  analyze-gateway:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/analyze.sh gateway
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # --- 短い名前 (node と gateway の両方をまとめて実行する). 個別のサービスは上の *-node / *-gateway ---

  # 実機用のビルド (node と gateway の両方)
  build:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/build.sh all
    environment: *build-env

  # 単体テスト (node と gateway と common の全て)
  test:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west twister -T app/thermo-node/tests -T app/thermo-gateway/tests -T app/common/tests -p native_sim/native/64 -O /tmp/twister-out --inline-logs -x=Zephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # カバレッジ (node と gateway と common の全て. 100% 未満なら失敗する)
  coverage:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: sh -c "scripts/coverage.sh node && scripts/coverage.sh gateway && scripts/coverage.sh common"
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # 静的解析 (node と gateway の両方. 指摘があれば失敗する)
  analyze:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: scripts/analyze.sh all
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # 仮想コントローラ (btvirt) を使い, BLE 付きで両方のシミュレーションを実行する.
  # Bluetooth ハードウェアは不要. Ctrl+C で停止する.
  # btvirt は AF_ALG (カーネル暗号) ソケットを開くが, Docker 既定の
  # seccomp と AppArmor のプロファイルはどちらもこれを拒否する.
  # 許可しないと btvirt はクライアントを切断してしまう.
  run-sim:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /tmp
    user: "${UID:-0}:${GID:-0}"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      - bash
      - -c
      - |
        B=/workspace/esp32-thermo-system/build
        btvirt -s >/dev/null &
        until [ -S /tmp/bt-server-bredrle ]; do sleep 0.1; done
        $$B/thermo-node-sim/zephyr/zephyr.exe --bt-dev=/tmp/bt-server-bredrle &
        sleep 1
        $$B/thermo-gateway-sim/zephyr/zephyr.exe --bt-dev=/tmp/bt-server-bredrle &
        trap 'kill $$(jobs -p) 2>/dev/null' EXIT INT TERM
        wait -n
    init: true

  # 開発用シェル
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-dev
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    stdin_open: true
    tty: true
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp
    command: /bin/bash

  # 生成物 (build/ と docs/) を全て消す. 次のビルドは最初からやり直す.
  # どちらも .gitignore に入っていて, ビルドとドキュメントの生成で作り直せる.
  # (root で作ったものは消せない. UID と GID をエクスポートしていないときは sudo で消す)
  clean:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: sh -c "rm -rf build docs && echo 'Removed build/ and docs/'"


version: '3.8'

services:
  # Build thermo-node
  build-thermo-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-node-build
    volumes:
      - .:/workspace
      - west-cache:/root/.cache
    working_dir: /workspace
    command: bash -c "west init -l . && west build -b xiao_esp32c3 app/thermo-node"
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.16.5
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr

  # Build thermo-gateway
  build-thermo-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-gateway-build
    volumes:
      - .:/workspace
      - west-cache:/root/.cache
    working_dir: /workspace
    command: bash -c "west init -l . && west build -b xiao_esp32c3 app/thermo-gateway"
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.16.5
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr

  # Development shell
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-dev
    volumes:
      - .:/workspace
      - west-cache:/root/.cache
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.16.5
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
    command: /bin/bash

volumes:
  west-cache:
    driver: local

services:
  # Build thermo-node
  build-thermo-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-node-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west build -b xiao_esp32c3 app/thermo-node -d build/thermo-node -- -DZephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # Build thermo-gateway
  build-thermo-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-gateway-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west build -b xiao_esp32c3 app/thermo-gateway -d build/thermo-gateway -- -DZephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # Build thermo-node for simulation
  build-thermo-node-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-node-sim-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west build -b native_sim/native/64 app/thermo-node -d build/thermo-node-sim -- -DCONF_FILE=prj-native_sim.conf -DZephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # Build thermo-gateway for simulation
  build-thermo-gateway-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-gateway-sim-build
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    command: west build -b native_sim/native/64 app/thermo-gateway -d build/thermo-gateway-sim -- -DCONF_FILE=prj-native_sim.conf -DZephyr-sdk_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4/cmake
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp

  # Run both simulations with BLE using virtual controllers (btvirt).
  # No Bluetooth hardware is needed. Stop with Ctrl+C.
  # btvirt opens an AF_ALG (kernel crypto) socket, which Docker's default
  # seccomp and AppArmor profiles both deny; without it btvirt drops the client.
  run-sim:
    image: esp32-thermo-system:latest
    volumes:
      - .:/workspace/esp32-thermo-system:ro
    working_dir: /tmp
    user: "${UID:-0}:${GID:-0}"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      - bash
      - -c
      - |
        B=/workspace/esp32-thermo-system/build
        btvirt -s >/dev/null &
        until [ -S /tmp/bt-server-bredrle ]; do sleep 0.1; done
        $$B/thermo-node-sim/zephyr/zephyr.exe --bt-dev=/tmp/bt-server-bredrle &
        sleep 1
        $$B/thermo-gateway-sim/zephyr/zephyr.exe --bt-dev=/tmp/bt-server-bredrle &
        trap 'kill $$(jobs -p) 2>/dev/null' EXIT INT TERM
        wait -n
    init: true

  # Development shell
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp32-thermo-system:latest
    container_name: esp32-thermo-dev
    volumes:
      - .:/workspace/esp32-thermo-system
    working_dir: /workspace/esp32-thermo-system
    user: "${UID:-0}:${GID:-0}"
    stdin_open: true
    tty: true
    environment:
      - ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk/zephyr-sdk-0.17.4
      - ZEPHYR_TOOLCHAIN_VARIANT=zephyr
      - HOME=/tmp
    command: /bin/bash
